<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MiniMax M3.1 Flash - Space Bunny 3D Motion (High-Fidelity Cinema Replica)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111827;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      transform-origin: top left;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #ui-overlay {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      color: #fff;
      font-size: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
    .btn {
      background: #f97316;
      border: none;
      color: #fff;
      padding: 6px 16px;
      border-radius: 9999px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover { background: #ea580c; }
    .btn:active { transform: scale(0.96); }
    #time-slider {
      width: 340px;
      cursor: pointer;
      accent-color: #f97316;
    }
    #time-display {
      font-family: monospace;
      font-size: 13px;
      color: #cbd5e1;
      min-width: 95px;
    }
  </style>
  <script src="libs/three.min.js"></script>
  <script src="libs/gsap.min.js"></script>
  <script src="libs/helvetiker_bold.js"></script>
</head>
<body>

  <div id="canvas-container">
    <canvas id="webgl-canvas"></canvas>
  </div>

  <div id="ui-overlay">
    <button class="btn" id="play-btn">播放 / 暂停</button>
    <input type="range" id="time-slider" min="0" max="26.08" step="0.01" value="0">
    <span id="time-display">00:00.00 / 26.08</span>
    <button class="btn" id="reset-btn" style="background: #475569;">重置</button>
  </div>

  <audio id="soundtrack" src="../space_bunny/soundtrack.wav" preload="auto"></audio>

  <script>
    // --- Constants ---
    const TOTAL_DURATION = 26.083;
    const FPS = 60;
    const WIDTH = 1920;
    const HEIGHT = 1080;

    function resizeContainer() {
      const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
      const container = document.getElementById('canvas-container');
      container.style.transform = `scale(${scale})`;
      container.style.left = `${(window.innerWidth - WIDTH * scale) / 2}px`;
      container.style.top = `${(window.innerHeight - HEIGHT * scale) / 2}px`;
    }
    window.addEventListener('resize', resizeContainer);
    resizeContainer();

    // --- Font Setup ---
    let font3D = null;
    if (window.HELVETIKER_FONT_DATA && THREE.FontLoader) {
      font3D = new THREE.FontLoader().parse(window.HELVETIKER_FONT_DATA);
    }

    // Helper: Build 3D Extruded Text Mesh
    function create3DText(text, size, height, color, bevel = true) {
      if (!font3D) return new THREE.Group();
      const geo = new THREE.TextGeometry(text, {
        font: font3D,
        size: size,
        height: height,
        curveSegments: 8,
        bevelEnabled: bevel,
        bevelThickness: bevel ? size * 0.05 : 0,
        bevelSize: bevel ? size * 0.04 : 0,
        bevelSegments: 4
      });
      geo.computeBoundingBox();
      const centerOffsetX = -0.5 * (geo.boundingBox.max.x - geo.boundingBox.min.x);
      const centerOffsetY = -0.5 * (geo.boundingBox.max.y - geo.boundingBox.min.y);
      geo.translate(centerOffsetX, centerOffsetY, 0);

      const mat = new THREE.MeshStandardMaterial({
        color: color,
        roughness: 0.35,
        metalness: 0.1
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // --- Three.js Renderer Setup ---
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false,
      powerPreference: 'high-performance',
      preserveDrawingBuffer: true
    });
    renderer.setSize(WIDTH, HEIGHT);
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.25;

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(40, WIDTH / HEIGHT, 0.1, 1000);
    camera.position.set(0, 3.5, 15);

    // --- Cinematic Sky Dome / Gradient Background ---
    const skyGeo = new THREE.SphereGeometry(180, 32, 24);
    // Vertical gradient shader
    const skyMat = new THREE.ShaderMaterial({
      uniforms: {
        topColor: { value: new THREE.Color(0x627d96) },
        midColor: { value: new THREE.Color(0xb69c9b) },
        botColor: { value: new THREE.Color(0xe2beaa) },
        offset: { value: 10 },
        exponent: { value: 0.75 }
      },
      vertexShader: `
        varying vec3 vWorldPosition;
        void main() {
          vec4 worldPosition = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPosition.xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform vec3 topColor;
        uniform vec3 midColor;
        uniform vec3 botColor;
        varying vec3 vWorldPosition;
        void main() {
          float h = normalize(vWorldPosition).y;
          vec3 col;
          if (h > 0.0) {
            col = mix(midColor, topColor, pow(h, 0.8));
          } else {
            col = mix(midColor, botColor, pow(-h, 0.8));
          }
          gl_FragColor = vec4(col, 1.0);
        }
      `,
      side: THREE.BackSide
    });
    const sky = new THREE.Mesh(skyGeo, skyMat);
    scene.add(sky);

    // --- Studio Lighting Setup ---
    // 1. Sun / Key Light
    const sunLight = new THREE.DirectionalLight(0xfffaec, 1.45);
    sunLight.position.set(12, 22, 14);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 4096;
    sunLight.shadow.mapSize.height = 4096;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 70;
    sunLight.shadow.camera.left = -16;
    sunLight.shadow.camera.right = 16;
    sunLight.shadow.camera.top = 16;
    sunLight.shadow.camera.bottom = -16;
    sunLight.shadow.bias = -0.0003;
    scene.add(sunLight);

    // 2. Sky Fill Light (Cyan/Blue)
    const skyFill = new THREE.DirectionalLight(0x89b0d6, 0.65);
    skyFill.position.set(-12, 10, -6);
    scene.add(skyFill);

    // 3. Ground Bounce Light (Warm Amber)
    const groundBounce = new THREE.DirectionalLight(0xf5d2ba, 0.75);
    groundBounce.position.set(0, -12, 4);
    scene.add(groundBounce);

    // 4. Soft Hemisphere Light
    const hemiLight = new THREE.HemisphereLight(0xa5c4e0, 0xdcb89d, 0.8);
    scene.add(hemiLight);

    // --- Materials ---
    const matCarrot = new THREE.MeshStandardMaterial({
      color: 0xff6618,
      roughness: 0.38,
      metalness: 0.04
    });
    const matCarrotTip = new THREE.MeshStandardMaterial({
      color: 0xf43f5e,
      roughness: 0.4,
      metalness: 0.05
    });
    const matLeaf = new THREE.MeshStandardMaterial({
      color: 0x4d801e,
      roughness: 0.55,
      metalness: 0.05
    });
    const matCloud = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      roughness: 0.94,
      metalness: 0.0
    });
    const matFloor = new THREE.MeshStandardMaterial({
      color: 0xddc1aa,
      roughness: 0.78
    });
    const matMetal = new THREE.MeshStandardMaterial({
      color: 0x475569,
      roughness: 0.35,
      metalness: 0.65
    });
    const matGold = new THREE.MeshStandardMaterial({
      color: 0xf59e0b,
      roughness: 0.28,
      metalness: 0.55
    });
    const matShieldGreen = new THREE.MeshStandardMaterial({
      color: 0x16a34a,
      roughness: 0.35,
      metalness: 0.15
    });
    const matShieldDark = new THREE.MeshStandardMaterial({
      color: 0x14532d,
      roughness: 0.3,
      metalness: 0.25
    });
    const matGlass = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      transmission: 0.92,
      opacity: 0.96,
      transparent: true,
      roughness: 0.16,
      ior: 1.54,
      thickness: 1.5,
      reflectivity: 0.9,
      specularIntensity: 1.2
    });

    // Helper: High-Res Canvas Texture
    function makeCanvasTexture(drawFn, width = 1024, height = 512) {
      const c = document.createElement('canvas');
      c.width = width;
      c.height = height;
      const ctx = c.getContext('2d');
      drawFn(ctx, width, height);
      const texture = new THREE.CanvasTexture(c);
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    // Bunny Badge Texture
    const bunnyBadgeTexture = makeCanvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(w/2, h/2, w/2 * 0.92, 0, Math.PI * 2);
      ctx.fill();

      // Bunny head silhouette
      ctx.fillStyle = '#1e293b';
      // ears
      ctx.beginPath();
      ctx.ellipse(w/2 - 65, h/2 - 130, 32, 90, -0.15, 0, Math.PI * 2);
      ctx.ellipse(w/2 + 65, h/2 - 130, 32, 90, 0.15, 0, Math.PI * 2);
      ctx.fill();
      // head
      ctx.beginPath();
      ctx.arc(w/2, h/2 - 35, 80, 0, Math.PI * 2);
      ctx.fill();

      // Text: SPACE BUNNY
      ctx.font = '900 56px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('SPACE', w/2, h/2 + 100);
      ctx.font = '900 48px -apple-system, sans-serif';
      ctx.fillText('BUNNY', w/2, h/2 + 165);
    }, 512, 512);

    // Carrots Sliced Cross-Section Texture
    const carrotSliceTexture = makeCanvasTexture((ctx, w, h) => {
      const cx = w / 2, cy = h / 2, r = w / 2 - 8;
      // Outer peel
      ctx.fillStyle = '#c2410c';
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Outer cortex
      ctx.fillStyle = '#ea580c';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.92, 0, Math.PI * 2);
      ctx.fill();

      // Mid rings
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.78, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fb923c';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.60, 0, Math.PI * 2);
      ctx.fill();

      // Core
      ctx.fillStyle = '#fed7aa';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.40, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffedd5';
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.20, 0, Math.PI * 2);
      ctx.fill();
    }, 512, 512);

    // --- Mesh Builders ---

    // 1. Organic Fluffy Cumulus Cloud
    function createFluffyCloud(scale = 1.0) {
      const g = new THREE.Group();
      const numSpheres = 12;
      for (let i = 0; i < numSpheres; i++) {
        const r = (0.7 + Math.random() * 0.7) * scale;
        const sphere = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 20), matCloud);
        const theta = (i / numSpheres) * Math.PI * 2;
        const dist = (0.8 + Math.random() * 0.6) * scale;
        sphere.position.set(
          Math.cos(theta) * dist,
          (Math.random() - 0.5) * 0.7 * scale,
          Math.sin(theta) * dist
        );
        sphere.castShadow = true;
        sphere.receiveShadow = true;
        g.add(sphere);
      }
      return g;
    }

    // 2. Organic Hand-Sculpted Carrot Rocket (Lathe Spline)
    function createSculptedCarrotRocket() {
      const rocket = new THREE.Group();

      // Lathe profile points for body
      const points = [];
      points.push(new THREE.Vector2(0.0, 3.4));  // tip apex
      points.push(new THREE.Vector2(0.4, 3.2));
      points.push(new THREE.Vector2(0.85, 2.7));
      points.push(new THREE.Vector2(1.2, 2.0));  // shoulder
      points.push(new THREE.Vector2(1.35, 1.2));
      points.push(new THREE.Vector2(1.38, 0.4));
      points.push(new THREE.Vector2(1.32, -0.4));
      points.push(new THREE.Vector2(1.2, -1.2));
      points.push(new THREE.Vector2(0.95, -1.8)); // bottom taper
      points.push(new THREE.Vector2(0.65, -2.1));
      points.push(new THREE.Vector2(0.0, -2.1));

      const latheGeo = new THREE.LatheGeometry(points, 36);
      const body = new THREE.Mesh(latheGeo, matCarrot);
      body.castShadow = true;
      body.receiveShadow = true;
      rocket.add(body);

      // Nose Tip Accent (Pink/Coral)
      const tipGeo = new THREE.ConeGeometry(0.86, 1.5, 36);
      const tip = new THREE.Mesh(tipGeo, matCarrotTip);
      tip.position.y = 2.45;
      tip.castShadow = true;
      rocket.add(tip);

      // Rocket Booster Motor
      const nozzleGeo = new THREE.CylinderGeometry(0.55, 0.8, 0.7, 24);
      const nozzle = new THREE.Mesh(nozzleGeo, matMetal);
      nozzle.position.y = -2.35;
      nozzle.castShadow = true;
      rocket.add(nozzle);

      // 4 Flowing Curved Leaves
      for (let i = 0; i < 4; i++) {
        const leafGroup = new THREE.Group();
        const a = (i / 4) * Math.PI * 2;

        const leafShape = new THREE.Shape();
        leafShape.moveTo(0, 0);
        leafShape.quadraticCurveTo(0.45, 1.2, 0.2, 2.2);
        leafShape.quadraticCurveTo(0, 2.3, -0.2, 2.2);
        leafShape.quadraticCurveTo(-0.45, 1.2, 0, 0);

        const leafExtrude = new THREE.ExtrudeGeometry(leafShape, {
          depth: 0.12,
          bevelEnabled: true,
          bevelThickness: 0.04,
          bevelSize: 0.04
        });
        const leafMesh = new THREE.Mesh(leafExtrude, matLeaf);
        leafMesh.rotation.x = Math.PI / 2;
        leafMesh.rotation.z = -0.55;
        leafMesh.castShadow = true;
        leafGroup.add(leafMesh);

        leafGroup.position.set(Math.cos(a) * 1.0, -1.6, Math.sin(a) * 1.0);
        leafGroup.rotation.y = a;
        rocket.add(leafGroup);
      }

      // Space Bunny Badge
      const badgeGeo = new THREE.CylinderGeometry(0.52, 0.52, 0.08, 32);
      const matBadgeSide = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.3 });
      const matBadgeFace = new THREE.MeshBasicMaterial({ map: bunnyBadgeTexture });
      const badge = new THREE.Mesh(badgeGeo, [matBadgeSide, matBadgeFace, matBadgeSide]);
      badge.position.set(0, 0.5, 1.34);
      badge.rotation.x = Math.PI / 2;
      badge.castShadow = true;
      rocket.add(badge);

      return rocket;
    }

    // 3. 3D Earth Globe
    function createEarthGlobe() {
      const globe = new THREE.Group();
      const ocean = new THREE.Mesh(
        new THREE.SphereGeometry(2.2, 36, 36),
        new THREE.MeshStandardMaterial({ color: 0x2563eb, roughness: 0.32, metalness: 0.08 })
      );
      ocean.castShadow = true;
      globe.add(ocean);

      const matCont = new THREE.MeshStandardMaterial({ color: 0x4ade80, roughness: 0.8 });
      for (let i = 0; i < 11; i++) {
        const patch = new THREE.Mesh(new THREE.SphereGeometry(0.75 + (i % 3) * 0.3, 16, 16), matCont);
        const phi = (i / 11) * Math.PI;
        const theta = i * 1.38;
        patch.position.setFromSphericalCoords(2.12, phi, theta);
        patch.scale.set(1.4, 0.9, 0.22);
        patch.lookAt(0, 0, 0);
        globe.add(patch);
      }

      for (let j = 0; j < 6; j++) {
        const c = createFluffyCloud(0.35);
        const ang = (j / 6) * Math.PI * 2;
        c.position.set(Math.cos(ang) * 3.0, Math.sin(j * 1.1) * 1.2, Math.sin(ang) * 3.0);
        globe.add(c);
      }

      return globe;
    }

    // 4. Launch Tower & Pad Base
    function createLaunchpad() {
      const g = new THREE.Group();

      // Sand Floor Slab
      const floor = new THREE.Mesh(new THREE.CylinderGeometry(20, 21, 1.2, 64), matFloor);
      floor.position.y = -0.6;
      floor.receiveShadow = true;
      g.add(floor);

      // Cylindrical Launch Base
      const pad = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.4, 0.8, 36), matMetal);
      pad.position.y = 0.4;
      pad.receiveShadow = true;
      pad.castShadow = true;
      g.add(pad);

      // Gantry Tower
      const tower = new THREE.Group();
      tower.position.set(-5.2, 4.0, -1.2);
      const postGeo = new THREE.CylinderGeometry(0.14, 0.14, 8.5, 8);
      for (let x of [-1.0, 1.0]) {
        for (let z of [-1.0, 1.0]) {
          const post = new THREE.Mesh(postGeo, matMetal);
          post.position.set(x, 0, z);
          post.castShadow = true;
          tower.add(post);
        }
      }
      for (let y = -3.5; y <= 3.5; y += 1.4) {
        const strut = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.1, 2.1), matMetal);
        strut.position.y = y;
        tower.add(strut);
      }
      g.add(tower);

      // Spotlight Poles
      for (let px of [4.2, 5.8]) {
        const pole = new THREE.Group();
        pole.position.set(px, 2.2, 2.8);
        const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 4.2, 8), matMetal);
        pole.add(mast);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.45, 0.45), new THREE.MeshStandardMaterial({
          color: 0xfef08a,
          emissive: 0xfef08a,
          emissiveIntensity: 0.8
        }));
        head.position.y = 2.2;
        pole.add(head);
        g.add(pole);
      }

      // Base Clouds
      for (let i = 0; i < 9; i++) {
        const c = createFluffyCloud(0.75);
        const ang = (i / 9) * Math.PI * 2;
        c.position.set(Math.cos(ang) * 4.8, 0.5, Math.sin(ang) * 4.2);
        g.add(c);
      }

      return g;
    }

    // --- Scene Graph Construction ---
    const sceneRoot = new THREE.Group();
    scene.add(sceneRoot);

    // [1] Launchpad & Scene 1
    const launchpad = createLaunchpad();
    sceneRoot.add(launchpad);

    const rocketPad = createSculptedCarrotRocket();
    rocketPad.position.set(0, 3.2, 0);
    sceneRoot.add(rocketPad);

    // True 3D Extruded Countdown Numbers: 1, 2, 3
    const countdown3D = new THREE.Group();
    countdown3D.position.set(2.2, 1.2, 3.6);
    countdown3D.rotation.y = -0.3;
    const num1 = create3DText('1', 1.6, 0.45, 0xf1f5f9);
    num1.position.set(-1.8, 0, 0);
    countdown3D.add(num1);
    const num2 = create3DText('2', 1.8, 0.45, 0xf1f5f9);
    num2.position.set(0, 0, 0);
    countdown3D.add(num2);
    const num3 = create3DText('3', 2.0, 0.45, 0xf1f5f9);
    num3.position.set(1.8, 0, 0);
    countdown3D.add(num3);
    sceneRoot.add(countdown3D);

    // "匿名登场" Title
    const anonTitleTex = makeCanvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 96px "PingFang SC", sans-serif';
      ctx.textAlign = 'right';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 12;
      ctx.fillText('匿名登场', w - 40, h/2 + 32);
    }, 1024, 256);
    const anonTitlePlane = new THREE.Mesh(
      new THREE.PlaneGeometry(6, 1.5),
      new THREE.MeshBasicMaterial({ map: anonTitleTex, transparent: true })
    );
    anonTitlePlane.position.set(4.2, 6.5, 0);
    sceneRoot.add(anonTitlePlane);

    // Launch Smoke Billows
    const launchSmoke = new THREE.Group();
    for (let i = 0; i < 22; i++) {
      const s = new THREE.Mesh(new THREE.SphereGeometry(0.8 + Math.random() * 0.9, 18, 18), matCloud);
      s.position.set((Math.random() - 0.5) * 3.8, Math.random() * 2.5, (Math.random() - 0.5) * 3.8);
      launchSmoke.add(s);
    }
    launchSmoke.position.set(0, 0.6, 0);
    launchSmoke.visible = false;
    sceneRoot.add(launchSmoke);

    // [2] Scene 2: OpenRouter #1 Ascending Scene
    const scene2Group = new THREE.Group();
    scene2Group.visible = false;
    sceneRoot.add(scene2Group);

    const openRouterTex = makeCanvasTexture((ctx, w, h) => {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 84px "PingFang SC", sans-serif';
      ctx.textAlign = 'left';
      ctx.shadowColor = 'rgba(0,0,0,0.3)';
      ctx.shadowBlur = 10;
      ctx.fillText('10 天，', 60, 110);
      ctx.font = 'bold 96px "PingFang SC", sans-serif';
      ctx.fillText('OpenRouter 第一', 60, 230);
      ctx.font = 'bold 64px monospace';
      ctx.fillStyle = '#fed7aa';
      ctx.fillText('56.7T tokens', 60, 330);
    }, 1200, 450);
    const openRouterPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(7.2, 2.7),
      new THREE.MeshBasicMaterial({ map: openRouterTex, transparent: true })
    );
    openRouterPlane.position.set(-4.5, 4.2, 0);
    scene2Group.add(openRouterPlane);

    // [3] Scene 3: Sliced Carrot & Naming
    const slicedCarrotGroup = new THREE.Group();
    slicedCarrotGroup.visible = false;
    sceneRoot.add(slicedCarrotGroup);

    const earthGlobe = createEarthGlobe();
    earthGlobe.position.set(3.4, -3.2, -4);
    slicedCarrotGroup.add(earthGlobe);

    const sliceMeshes = [];
    const matCutFace = new THREE.MeshStandardMaterial({ map: carrotSliceTexture, roughness: 0.45 });
    for (let i = 0; i < 4; i++) {
      const sliceG = new THREE.Group();
      if (i === 0) {
        // Base + Leaves
        const b = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 0.9, 1.4, 36), matCarrot);
        sliceG.add(b);
        const cut = new THREE.Mesh(new THREE.CircleGeometry(1.2, 36), matCutFace);

      shape.lineTo(-w/2 + r, h/2);
      shape.quadraticCurveTo(-w/2, h/2, -w/2, h/2 - r);
      shape.lineTo(-w/2, -h/2 + r);
      shape.quadraticCurveTo(-w/2, -h/2, -w/2 + r, -h/2);

      return new THREE.ExtrudeGeometry(shape, {
        depth: d,
        bevelEnabled: true,
        bevelThickness: 0.1,
        bevelSize: 0.08,
        bevelSegments: 4
      });

    let isPlaying = false;

    function formatTime(s) {
      const mins = Math.floor(s / 60);
      const secs = (s % 60).toFixed(2);
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function update() {
      if (isPlaying) {
        const elapsed = (performance.now() - startTime) / 1000;
        if (elapsed >= TOTAL_DURATION) {
          isPlaying = false;
          playBtn.innerText = '播放';
          pausedAt = 0;
          soundtrack.pause();
          soundtrack.currentTime = 0;
        } else {
          timeSlider.value = elapsed;
          timeDisplay.innerText = `${formatTime(elapsed)} / ${formatTime(TOTAL_DURATION)}`;
          window.renderAtTime(elapsed);
          requestAnimationFrame(update);
        }
      }
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) {
        isPlaying = false;
        playBtn.innerText = '播放';
        pausedAt = parseFloat(timeSlider.value);
        soundtrack.pause();
      } else {
        isPlaying = true;
        playBtn.innerText = '暂停';
        startTime = performance.now() - pausedAt * 1000;
        soundtrack.currentTime = pausedAt;
        soundtrack.play().catch(() => {});
        requestAnimationFrame(update);
      }
    });

    timeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      pausedAt = val;
      startTime = performance.now() - val * 1000;
      timeDisplay.innerText = `${formatTime(val)} / ${formatTime(TOTAL_DURATION)}`;
      soundtrack.currentTime = val;
      window.renderAtTime(val);
    });

    document.getElementById('reset-btn').addEventListener('click', () => {
      isPlaying = false;
      playBtn.innerText = '播放';
      pausedAt = 0;
      timeSlider.value = 0;
      timeDisplay.innerText = `00:00.00 / ${formatTime(TOTAL_DURATION)}`;
      soundtrack.pause();
      soundtrack.currentTime = 0;
      window.renderAtTime(0);
    });

    // Initial render at t = 0
    window.renderAtTime(0);
  </script>
</body>
</html>
