<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Puffin Girl - Single File Canvas Art</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    background: #fbf9f4;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  canvas {
    display: block;
    width: 1200px;
    height: 1200px;
    background: #fbf9f4;
  }
</style>
</head>
<body>

<canvas id="artCanvas" width="1200" height="1200"></canvas>

<script>
// ===========================================================================
// PURE SINGLE-FILE PROCEDURAL CANVAS ART
// Zero external libraries | Zero skills | Zero image generators | Zero assets
// ===========================================================================

const canvas = document.getElementById('artCanvas');
const ctx = canvas.getContext('2d');
const W = 1200, H = 1200;

let seed = 98765;
function rnd() {
  seed = (seed * 16807) % 2147483647;
  return (seed - 1) / 2147483646;
}
function rndRange(min, max) { return min + rnd() * (max - min); }

// Organic Poly with edge jitter and stippled chalk grain
function drawGouachePoly(points, fillColor, grainColor = null, jitter = 2.0, grainDensity = 0.65) {
  ctx.save();
  ctx.beginPath();
  
  const n = points.length;
  for (let i = 0; i < n; i++) {
    const p1 = points[i];
    const p2 = points[(i + 1) % n];
    if (i === 0) ctx.moveTo(p1[0], p1[1]);
    
    const dist = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
    const segs = Math.max(3, Math.floor(dist / 18));
    for (let s = 1; s <= segs; s++) {
      const t = s / segs;
      const nx = -(p2[1] - p1[1]);
      const ny = (p2[0] - p1[0]);
      const len = Math.hypot(nx, ny) || 1;
      const j = (rnd() - 0.5) * jitter * 2.5;
      const px = p1[0] + (p2[0] - p1[0]) * t + (nx / len) * j;
      const py = p1[1] + (p2[1] - p1[1]) * t + (ny / len) * j;
      ctx.lineTo(px, py);
    }
  }
  ctx.closePath();
  ctx.fillStyle = fillColor;
  ctx.fill();

  // Internal chalk / crayon texture
  ctx.clip();
  let minX = W, maxX = 0, minY = H, maxY = 0;
  for (const [x, y] of points) {
    if (x < minX) minX = x;
    if (x > maxX) maxX = x;
    if (y < minY) minY = y;
    if (y > maxY) maxY = y;
  }
  
  const col = grainColor || fillColor;
  ctx.fillStyle = col;
  const dotCount = (maxX - minX) * (maxY - minY) * (grainDensity * 0.0022);
  for (let i = 0; i < dotCount; i++) {
    const rx = rndRange(minX, maxX);
    const ry = rndRange(minY, maxY);
    const rad = rndRange(0.8, 2.0);
    ctx.globalAlpha = rndRange(0.12, 0.38);
    ctx.beginPath();
    ctx.arc(rx, ry, rad, 0, Math.PI * 2);
    ctx.fill();
  }

  // Directional chalk pencil strokes
  ctx.strokeStyle = col;
  ctx.lineWidth = rndRange(1.2, 2.2);
  const strokeCount = (maxY - minY) * 0.22;
  for (let i = 0; i < strokeCount; i++) {
    const sy = rndRange(minY, maxY);
    const sx = rndRange(minX, maxX - 40);
    ctx.globalAlpha = rndRange(0.06, 0.16);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + rndRange(20, 55), sy + rndRange(-2, 2));
    ctx.stroke();
  }

  ctx.restore();
}

// Crayon line with hand-drawn wobble
function drawCrayonLine(x1, y1, x2, y2, color, width = 3, jitter = 1.8) {
  ctx.save();
  ctx.strokeStyle = color;
  ctx.lineCap = 'round';
  const dist = Math.hypot(x2 - x1, y2 - y1);
  const steps = Math.max(4, Math.floor(dist / 8));
  for (let pass = 0; pass < 3; pass++) {
    ctx.globalAlpha = pass === 0 ? 0.7 : 0.35;
    ctx.lineWidth = width * (0.8 + rnd() * 0.4);
    ctx.beginPath();
    ctx.moveTo(x1 + (rnd() - 0.5) * jitter, y1 + (rnd() - 0.5) * jitter);
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      const px = x1 + (x2 - x1) * t + (rnd() - 0.5) * jitter;
      const py = y1 + (y2 - y1) * t + (rnd() - 0.5) * jitter;
      ctx.lineTo(px, py);
    }
    ctx.stroke();
  }
  ctx.restore();
}

// Rosy cheek / blush spray
function drawBlushSpray(cx, cy, rx, ry, color, count = 1800, maxR = 2.4) {
  ctx.save();
  ctx.fillStyle = color;
  for (let i = 0; i < count; i++) {
    const ang = rnd() * Math.PI * 2;
    const r = Math.pow(rnd(), 0.55);
    const px = cx + Math.cos(ang) * rx * r + (rnd() - 0.5) * 3;
    const py = cy + Math.sin(ang) * ry * r + (rnd() - 0.5) * 3;
    const dotR = (1 - r * 0.6) * rndRange(0.8, maxR);
    ctx.globalAlpha = (1 - r * 0.8) * rndRange(0.18, 0.55);
    ctx.beginPath();
    ctx.arc(px, py, dotR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function renderIllustration() {
  // 1. PAPER BACKGROUND
  ctx.fillStyle = '#faf8f4';
  ctx.fillRect(0, 0, W, H);

  // 2. BACK HAIR MASS (Dark Shaggy Bob)
  const hairBack = [
    [260, 320], [940, 320], [980, 480], [985, 660],
    [930, 710], [860, 640], [810, 715], [740, 645],
    [670, 710], [600, 640], [530, 715], [460, 645],
    [390, 710], [320, 640], [250, 690], [215, 620],
    [220, 440]
  ];
  drawGouachePoly(hairBack, '#121822', '#070a0e', 3.0, 0.85);

  // Whimsical hair tufts and flyaways
  const hairStrands = [
    [[220, 440], [150, 400], [140, 440]],
    [[230, 380], [140, 320], [160, 280]],
    [[240, 560], [160, 570], [180, 620]],
    [[980, 440], [1050, 400], [1070, 440]],
    [[970, 370], [1060, 310], [1050, 260]],
    [[970, 550], [1050, 560], [1040, 620]]
  ];
  for (const s of hairStrands) {
    ctx.strokeStyle = '#121822';
    ctx.lineWidth = 3.6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s[0][0], s[0][1]);
    ctx.quadraticCurveTo(s[1][0], s[1][1], s[2][0], s[2][1]);
    ctx.stroke();
  }

  // 3. TORSO & YELLOW COAT (Layer 0)
  const coatPoints = [
    [100, 1200], [120, 830], [220, 800], [320, 820],
    [400, 770], [500, 760], [570, 690], [660, 690],
    [730, 760], [830, 770], [900, 820], [1000, 800],
    [1100, 830], [1120, 1200]
  ];
  drawGouachePoly(coatPoints, '#e9b124', '#d49e17', 3.0, 0.75);

  // Purple horizontal chest stripe (Y: 1060 to 1150)
  ctx.save();
  ctx.beginPath();
  ctx.rect(90, 1060, 1040, 95);
  ctx.clip();
  drawGouachePoly([[90, 1060], [1130, 1060], [1130, 1155], [90, 1155]], '#7531b5', '#58218e', 2.5, 0.85);
  ctx.restore();

  // Dark Plaid Grid Lines across Coat
  for (let y = 820; y < 1200; y += 40) {
    drawCrayonLine(120, y, 1100, y, 'rgba(45, 35, 15, 0.45)', 2.0, 2.0);
  }
  for (let x = 180; x < 1080; x += 55) {
    drawCrayonLine(x, 800, x, 1200, 'rgba(45, 35, 15, 0.45)', 2.0, 2.0);
  }

  // Right Coat Pocket Flap
  drawGouachePoly([[750, 880], [870, 905], [855, 955], [740, 930]], '#dfa318', '#c48b0e', 2.0, 0.6);
  drawCrayonLine(750, 880, 870, 905, '#222', 2.4);
  drawCrayonLine(870, 905, 855, 955, '#222', 2.0);
  drawCrayonLine(855, 955, 740, 930, '#222', 2.0);
  drawCrayonLine(740, 930, 750, 880, '#222', 2.0);
  ctx.fillStyle = '#222';
  ctx.beginPath();
  ctx.arc(810, 930, 5.0, 0, Math.PI * 2);
  ctx.fill();

  // 4. INNER SAILOR STRIPED SHIRT & FLEECE COLLAR
  drawGouachePoly([[520, 710], [700, 710], [690, 1200], [530, 1200]], '#fdfbf7', '#dedad0', 2.0, 0.4);
  for (let sy = 750; sy < 1200; sy += 30) {
    ctx.fillStyle = '#2b6ab8';
    ctx.fillRect(525, sy, 170, 14);
    for (let k = 0; k < 35; k++) {
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(rndRange(525, 695), sy + rndRange(2, 12), rndRange(2, 6), 1.6);
    }
  }

  // High Fleece Collar - Left (Cobalt Blue with Pink Dashes)
  const leftCollar = [
    [415, 680], [570, 695], [545, 855], [460, 845], [415, 770]
  ];
  drawGouachePoly(leftCollar, '#2d65be', '#1d4ea0', 2.5, 0.7);
  ctx.strokeStyle = '#e64e9e';
  ctx.lineWidth = 4.2;
  ctx.lineCap = 'round';
  const stitchRows = [
    [[440, 720], [540, 725]],
    [[450, 750], [545, 758]],
    [[460, 780], [540, 790]],
    [[475, 810], [530, 818]]
  ];
  for (const [p1, p2] of stitchRows) {
    ctx.beginPath();
    ctx.moveTo(p1[0], p1[1]);
    ctx.lineTo(p2[0], p2[1]);
    ctx.stroke();
  }

  // High Fleece Collar - Right (Teal / Emerald Green)
  const rightCollar = [
    [640, 695], [795, 680], [795, 770], [755, 845], [665, 855]
  ];
  drawGouachePoly(rightCollar, '#139b6e', '#0c7d55', 2.5, 0.7);

  // Black cross-body strap
  drawGouachePoly([[390, 720], [510, 1200], [440, 1200], [340, 730]], '#222327', '#111214', 2.0, 0.6);

  // 5. SLENDER NECK
  drawGouachePoly([[570, 590], [640, 590], [650, 730], [560, 730]], '#fde4d3', '#f8d1ba', 2.0, 0.5);

  // 6. FACE & EARS (Centered around X ≈ 600, Y ≈ 540)
  const facePoints = [
    [390, 340], [810, 340], [860, 460], [840, 570],
    [760, 630], [660, 660], [540, 660], [440, 630],
    [370, 570], [350, 460]
  ];
  drawGouachePoly(facePoints, '#fde6d7', '#f8d5bf', 2.0, 0.55);

  // Ears
  drawGouachePoly([[340, 450], [380, 440], [380, 540], [335, 525], [315, 485]], '#fcdbc6', '#f3be9e', 2.0, 0.6);
  drawGouachePoly([[820, 440], [860, 450], [885, 485], [865, 525], [820, 540]], '#fcdbc6', '#f3be9e', 2.0, 0.6);

  // Chunky Gold Hoop Earrings
  ctx.strokeStyle = '#e8a81d';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.arc(365, 545, 20, 0, Math.PI * 2);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(845, 545, 20, 0, Math.PI * 2);
  ctx.stroke();

  // Rosy Cheek Gouache Blush Stippling
  drawBlushSpray(470, 495, 90, 60, '#e85c6d', 1600, 2.8);
  drawBlushSpray(740, 495, 90, 60, '#e85c6d', 1600, 2.8);
  drawBlushSpray(600, 485, 45, 30, '#e85465', 800, 2.4);

  // Freckles
  ctx.fillStyle = '#7b4034';
  for (let i = 0; i < 28; i++) {
    const fx = rndRange(490, 720);
    const fy = rndRange(475, 525);
    ctx.beginPath();
    ctx.arc(fx, fy, rndRange(1.3, 2.4), 0, Math.PI * 2);
    ctx.fill();
  }

  // Cute Pink Triangular Nose (At landmark 597, 541)
  drawGouachePoly([[585, 495], [612, 532], [600, 555], [575, 550]], '#d84d58', '#b5333d', 1.8, 0.7);
  ctx.fillStyle = '#221a1c';
  ctx.beginPath();
  ctx.arc(580, 548, 3.8, 0, Math.PI * 2);
  ctx.fill();

  // Sweet wry mouth (At landmark 600, 609)
  drawCrayonLine(570, 612, 630, 605, '#a6383f', 4.5, 1.2);

  // BIG ROUND CURIOUS EYES (Fully visible and open!)
  // Left Eye (Pupil center at 450, 460)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(460, 470, 45, 0, Math.PI * 2);
  ctx.fill();
  drawCrayonLine(415, 470, 505, 470, '#222', 2.0, 0.8);
  // Pupil looking up-right
  ctx.fillStyle = '#161d24';
  ctx.beginPath();
  ctx.arc(480, 450, 24, 0, Math.PI * 2);
  ctx.fill();
  // Catchlight
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(488, 442, 5.0, 0, Math.PI * 2);
  ctx.fill();

  // Right Eye (Pupil center at 775, 466)
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(765, 470, 45, 0, Math.PI * 2);
  ctx.fill();
  drawCrayonLine(720, 470, 810, 470, '#222', 2.0, 0.8);
  // Pupil looking up-right
  ctx.fillStyle = '#161d24';
  ctx.beginPath();
  ctx.arc(785, 450, 24, 0, Math.PI * 2);
  ctx.fill();
  // Catchlight
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(793, 442, 5.0, 0, Math.PI * 2);
  ctx.fill();

  // Thin expressive eyebrows
  drawCrayonLine(420, 405, 495, 408, '#1b2229', 3.5, 1.5);
  drawCrayonLine(730, 408, 805, 400, '#1b2229', 3.5, 1.5);

  // Bangs tufts (Peeking out from under the hat brim)
  const bangsList = [
    [[370, 350], [410, 310], [450, 360]],
    [[480, 350], [515, 305], [550, 360]],
    [[710, 360], [745, 305], [780, 350]]
  ];
  for (const b of bangsList) {
    drawGouachePoly(b, '#121822', '#070a0e', 2.0, 0.7);
  }

  // 7. THE HAT (Purple brim at Y: 260-365; Blue/Green crown at Y: 140-270)
  // Hat Brim (Rich Purple #6e39a6, tilted cloche shape)
  const brimPoints = [];
  const brimW = 340, brimH = 55, brimCY = 295;
  for (let a = 0; a <= Math.PI * 2; a += 0.08) {
    const rx = brimW + (rnd() - 0.5) * 8;
    const ry = (a < Math.PI ? brimH * 1.35 : brimH * 0.75) + (rnd() - 0.5) * 6;
    brimPoints.push([600 + Math.cos(a) * rx, brimCY + Math.sin(a) * ry]);
  }
  drawGouachePoly(brimPoints, '#6e39a6', '#512285', 2.8, 0.85);

  // Hat Crown (Split: Left Royal Blue / Right Emerald Green)
  const leftCrown = [
    [410, 275], [598, 275], [598, 140], [490, 165], [410, 230]
  ];
  drawGouachePoly(leftCrown, '#2262bc', '#164894', 2.4, 0.75);

  const rightCrown = [
    [602, 275], [790, 275], [790, 230], [710, 165], [602, 140]
  ];
  drawGouachePoly(rightCrown, '#12986c', '#0a704e', 2.4, 0.75);

  // Hat crease shadow
  drawCrayonLine(310, 300, 890, 300, '#351658', 4.5, 2.0);

  // 8. THE PUFFIN BIRD (Perched on crown, X: [390, 648], Y: [22, 249])
  const px = 530, py = 85;
  // Orange feet clasping hat apex
  drawGouachePoly([[px - 15, py + 65], [px + 8, py + 65], [px - 5, py + 78]], '#f05b26', '#c94110', 1.8, 0.7);
  drawGouachePoly([[px + 40, py + 65], [px + 62, py + 65], [px + 52, py + 78]], '#f05b26', '#c94110', 1.8, 0.7);

  // Black body, tail and wings
  const birdBack = [
    [px - 140, py + 55], [px - 75, py + 35], [px - 25, py + 15],
    [px + 25, py - 45], [px + 90, py - 65], [px + 110, py - 15],
    [px + 80, py + 55], [px - 25, py + 65]
  ];
  drawGouachePoly(birdBack, '#181e26', '#090d13', 2.4, 0.8);

  // White plump belly & head
  const birdWhite = [
    [px - 10, py + 62], [px + 72, py + 58], [px + 95, py + 8],
    [px + 105, py - 32], [px + 55, py - 48], [px + 18, py - 12],
    [px + 8, py + 38]
  ];
  drawGouachePoly(birdWhite, '#ffffff', '#e0dcd2', 1.8, 0.5);

  // Bird black cap
  drawGouachePoly([[px + 18, py - 45], [px + 90, py - 65], [px + 110, py - 35], [px + 55, py - 35]], '#181e26', '#090d13', 1.8, 0.75);

  // Puffin Beak (Striped orange/red wedge)
  const beakPoints = [
    [px + 105, py - 38], [px + 180, py - 18], [px + 170, py + 5], [px + 105, py + 10]
  ];
  drawGouachePoly(beakPoints, '#f05537', '#cf3718', 2.0, 0.75);
  drawCrayonLine(px + 132, py - 28, px + 128, py + 8, '#ff8a52', 4.0, 1.0);
  drawCrayonLine(px + 155, py - 20, px + 150, py + 4, '#ff8a52', 4.0, 1.0);
  drawCrayonLine(px + 108, py - 36, px + 108, py + 8, '#181e26', 6.0, 1.0);

  // Grumpy bird eye & furrowed brow
  ctx.fillStyle = '#181e26';
  ctx.beginPath();
  ctx.arc(px + 70, py - 20, 5.0, 0, Math.PI * 2);
  ctx.fill();
  drawCrayonLine(px + 55, py - 28, px + 82, py - 22, '#181e26', 3.6, 1.0);

  // 9. BINOCULARS (At landmark X: [516, 685], Y: [955, 1140])
  const bx = 600, by = 1045;
  // Twin barrels
  drawGouachePoly([[bx - 84, by - 60], [bx - 16, by - 60], [bx - 16, by + 60], [bx - 84, by + 60]], '#2864b5', '#194685', 2.0, 0.8);
  drawGouachePoly([[bx + 16, by - 60], [bx + 84, by - 60], [bx + 84, by + 60], [bx + 16, by + 60]], '#2864b5', '#194685', 2.0, 0.8);
  // Red top eyepieces
  drawGouachePoly([[bx - 78, by - 80], [bx - 22, by - 80], [bx - 16, by - 60], [bx - 84, by - 60]], '#d63d3d', '#ae2828', 1.8, 0.7);
  drawGouachePoly([[bx + 22, by - 80], [bx + 78, by - 80], [bx + 84, by - 60], [bx + 16, by - 60]], '#d63d3d', '#ae2828', 1.8, 0.7);
  // Cyan bottom lens rims
  drawGouachePoly([[bx - 87, by + 60], [bx - 13, by + 60], [bx - 17, by + 80], [bx - 83, by + 80]], '#1dc6c6', '#129393', 1.8, 0.7);
  drawGouachePoly([[bx + 13, by + 60], [bx + 87, by + 60], [bx + 83, by + 80], [bx + 17, by + 80]], '#1dc6c6', '#129393', 1.8, 0.7);
  // Center bridge & Brass focus wheel
  ctx.fillStyle = '#222';
  ctx.fillRect(bx - 20, by - 20, 40, 40);
  drawGouachePoly([[bx - 14, by - 14], [bx + 14, by - 14], [bx + 14, by + 14], [bx - 14, by + 14]], '#e8a91c', '#c78d11', 1.5, 0.7);
  // Strap cords
  drawCrayonLine(bx - 50, by - 80, bx - 75, by - 180, '#222', 4.5);
  drawCrayonLine(bx + 50, by - 80, bx + 75, by - 180, '#222', 4.5);

  // 10. FULL-FRAME PAPER TOOTH & GRAIN PASS
  const imgData = ctx.getImageData(0, 0, W, H);
  const d = imgData.data;
  for (let i = 0; i < d.length; i += 4) {
    const grain = (rnd() - 0.5) * 12;
    d[i] = Math.min(255, Math.max(0, d[i] + grain));
    d[i+1] = Math.min(255, Math.max(0, d[i+1] + grain));
    d[i+2] = Math.min(255, Math.max(0, d[i+2] + grain));
  }
  ctx.putImageData(imgData, 0, 0);

  console.log("Illustration rendered: 100% pure single-file canvas art.");
}

window.onload = renderIllustration;
</script>
</body>
</html>
